name: Deploy Worker

# 2026-05-25 起加固:GitHub Free + private repo 无法 require status checks,
# PR 级 pr-validation.yml 是软门槛(红叉不阻断 merge),
# 这里 push to main 的 validate-before-deploy job 是硬防线:
# validate fail → deploy 不跑 + PushDeer 告警,防红叉代码上 prod。

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'worker/**'
      - 'scripts/ci/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:
    inputs:
      env:
        description: '部署目标环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod

concurrency:
  group: deploy-worker-${{ (github.event_name == 'workflow_dispatch' && inputs.env) || (github.ref_name == 'main' && 'prod') || 'staging' }}
  cancel-in-progress: true

jobs:
  validate-before-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install worker deps
        working-directory: worker
        run: npm ci
      - name: Type check
        working-directory: worker
        run: npx tsc --noEmit
      - name: Worker tests
        working-directory: worker
        run: npm test
      - name: Worker deploy dry run
        working-directory: worker
        env:
          WRANGLER_LOG: none
        run: npx wrangler deploy --dry-run
      - name: Smoke admin-dashboard
        run: bash scripts/ci/admin-dashboard-smoke.sh
      - name: Notify on validation failure
        if: failure()
        env:
          PUSHDEER_ADMIN_KEYS: ${{ secrets.PUSHDEER_ADMIN_KEYS }}
        run: |
          bash scripts/ci/pushdeer-notify.sh \
            "[CI] 🚫 Worker prod deploy aborted" \
            "validate-before-deploy failed on ${{ github.ref_name }}@${{ github.sha }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  deploy:
    needs: validate-before-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker deps
        working-directory: worker
        run: npm ci

      - name: Determine env
        id: env
        run: |
          # 手动触发：用 inputs.env
          # push 触发：main → prod，staging → staging
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.env }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TARGET="prod"
          else
            TARGET="staging"
          fi
          if [ "$TARGET" = "prod" ] && [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Production deployment requires refs/heads/main (got ${GITHUB_REF:-unset})"
            exit 1
          fi
          if [ "$TARGET" = "prod" ]; then
            echo "wrangler_env=" >> $GITHUB_OUTPUT
            echo "label=prod (xlist-api)" >> $GITHUB_OUTPUT
          else
            echo "wrangler_env=--env staging" >> $GITHUB_OUTPUT
            echo "label=staging (xlist-api-staging)" >> $GITHUB_OUTPUT
          fi
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: Deploy to ${{ steps.env.outputs.label }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # 用项目本地的 wrangler（package.json devDependency），保证版本和 lockfile 一致
        run: npx wrangler deploy ${{ steps.env.outputs.wrangler_env }}

      - name: Notify on deploy failure
        if: failure()
        env:
          PUSHDEER_ADMIN_KEYS: ${{ secrets.PUSHDEER_ADMIN_KEYS }}
        run: |
          bash scripts/ci/pushdeer-notify.sh \
            "[CI] 🚫 Worker ${{ steps.env.outputs.label }} deploy failed" \
            "wrangler deploy failed on ${{ github.ref_name }}@${{ github.sha }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
