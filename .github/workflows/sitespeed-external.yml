name: External sitespeed.io baseline

on:
  push:
    branches:
      - 'codex/waterfall-ssr-rum-parallel'
    paths:
      - '.github/workflows/sitespeed-external.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitespeed-external-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: Measure ${{ matrix.cohort.name }} / ${{ matrix.device.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cohort:
          - name: classic
            url: https://ai-feeds.com/?view=classic
          - name: waterfall
            url: https://ai-feeds.com/?view=waterfall
        device:
          - mode: mobile
            mobile_args: --mobile
            downstream_kbps: 1600
            upstream_kbps: 750
            latency_ms: 150
          - mode: desktop
            mobile_args: ''
            downstream_kbps: 10240
            upstream_kbps: 10240
            latency_ms: 40
    steps:
      - uses: actions/checkout@v5

      - name: Prepare Linux traffic shaping
        run: sudo modprobe ifb numifbs=1

      - name: Run five read-only measurements
        run: >-
          docker run
          --rm
          --shm-size=2g
          --cap-add=NET_ADMIN
          -v "${{ github.workspace }}:/sitespeed.io"
          sitespeedio/sitespeed.io:42.0.1
          ${{ matrix.cohort.url }}
          -b chrome
          -n 5
          ${{ matrix.device.mobile_args }}
          --browsertime.connectivity.engine throttle
          --browsertime.connectivity.profile custom
          --browsertime.connectivity.downstreamKbps ${{ matrix.device.downstream_kbps }}
          --browsertime.connectivity.upstreamKbps ${{ matrix.device.upstream_kbps }}
          --browsertime.connectivity.latency ${{ matrix.device.latency_ms }}
          --browsertime.block 'https://api.ai-feeds.com/api/track*'
          --browsertime.block 'https://api.ai-feeds.com/api/items/*/refresh*'
          --video true
          --visualMetrics true
          --summary
          --utc true
          --outputFolder /sitespeed.io/output/sitespeed-${{ matrix.cohort.name }}-${{ matrix.device.mode }}

      - name: Verify browser traffic stayed read-only
        shell: bash
        run: |
          set -euo pipefail
          report_dir="output/sitespeed-${{ matrix.cohort.name }}-${{ matrix.device.mode }}"
          mapfile -t hars < <(find "$report_dir" -type f -name browsertime.har -print)
          if [[ "${#hars[@]}" -ne 1 ]]; then
            echo "expected exactly one browsertime.har, found ${#hars[@]}" >&2
            exit 1
          fi
          mutations="$(
            jq -r '
              .log.entries[]
              | select(
                  (.request.method | ascii_upcase) as $method
                  | $method != "GET" and $method != "HEAD" and $method != "OPTIONS"
                )
              | [.request.method, .request.url]
              | @tsv
            ' "${hars[0]}"
          )"
          if [[ -n "$mutations" ]]; then
            echo "browser issued non-read-only requests:" >&2
            echo "$mutations" >&2
            exit 1
          fi

      - name: Upload sitespeed.io report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sitespeed-${{ matrix.cohort.name }}-${{ matrix.device.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/sitespeed-${{ matrix.cohort.name }}-${{ matrix.device.mode }}/**
          if-no-files-found: warn
          retention-days: 14
