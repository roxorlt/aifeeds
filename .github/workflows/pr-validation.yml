name: PR Validation

# 软门槛:GitHub Free + private repo 无法 require status checks,
# 这里 PR 阶段红叉只是 UI 提醒(不阻断 merge)。硬防线在 deploy-*.yml
# 的 validate-before-deploy job,即便红叉 PR merge 进 main,prod
# deploy 之前还会再跑一遍 validate,fail 直接 abort + PushDeer 告警。

on:
  pull_request:
    paths:
      - 'worker/**'
      - 'dashboard/**'
      - 'deploy/**'
      - 'scripts/benchmark-aifeeds-upstream*'
      - 'scripts/run-aifeeds-staging-backfill*'
      - 'scripts/ci/**'
      - 'docs/operations.md'
      - 'docs/plans/2026-07-10-c-end-performance-optimization-plan.md'
      - 'docs/reviews/c-end-perf-staging-change-packet.md'
      - 'docs/reviews/c-end-performance-rollout-template.md'
      - '.github/workflows/**'

# dorny/paths-filter 需要读 PR changed files,默认 GITHUB_TOKEN 没此权限。
permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.filter.outputs.worker }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      admin_dashboard: ${{ steps.filter.outputs.admin_dashboard }}
      performance_ops: ${{ steps.filter.outputs.performance_ops }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            worker:
              - 'worker/**'
            dashboard:
              - 'dashboard/**'
            admin_dashboard:
              - 'worker/src/admin-dashboard.ts'
            performance_ops:
              - 'deploy/nginx/**'
              - 'deploy/systemd/aifeeds-performance-logrotate.*'
              - 'scripts/benchmark-aifeeds-upstream*'
              - 'scripts/run-aifeeds-staging-backfill*'
              - 'scripts/ci/performance-validation-contract.test.mjs'
              - 'docs/operations.md'
              - 'docs/plans/2026-07-10-c-end-performance-optimization-plan.md'
              - 'docs/reviews/c-end-perf-staging-change-packet.md'
              - 'docs/reviews/c-end-performance-rollout-template.md'
              - '.github/workflows/**'

  validate-worker:
    needs: detect-changes
    if: needs.detect-changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install worker deps
        working-directory: worker
        run: npm ci
      - name: Type check
        working-directory: worker
        run: npx tsc --noEmit
      - name: Worker tests
        working-directory: worker
        run: npm test
      - name: Worker deploy dry run
        working-directory: worker
        env:
          WRANGLER_LOG: none
        run: npx wrangler deploy --dry-run

  validate-dashboard:
    needs: detect-changes
    if: needs.detect-changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci
      - name: Cache pinned Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-webkit-${{ hashFiles('dashboard/package-lock.json') }}
      - name: Install Chromium, WebKit, and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: dashboard
        run: npx playwright install --with-deps chromium webkit
      - name: Install Chromium and WebKit system dependencies on cache hit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: dashboard
        run: npx playwright install-deps chromium webkit
      - name: Lint
        working-directory: dashboard
        run: npm run lint
      - name: Unit tests
        working-directory: dashboard
        run: npm run test:unit
      - name: Build (tsc + vite)
        working-directory: dashboard
        run: npm run build
      - name: Cross-device performance budgets
        working-directory: dashboard
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-playwright-${{ github.run_id }}
          path: dashboard/output/playwright/**
          if-no-files-found: ignore
          retention-days: 7

  smoke-admin-dashboard:
    needs: detect-changes
    if: needs.detect-changes.outputs.admin_dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install worker deps
        working-directory: worker
        run: npm ci
      - name: Run admin-dashboard smoke
        run: bash scripts/ci/admin-dashboard-smoke.sh

  validate-performance-ops:
    needs: detect-changes
    if: needs.detect-changes.outputs.performance_ops == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate benchmark, nginx templates, and deployment gates
        run: >-
          node --test
          scripts/benchmark-aifeeds-upstream.test.mjs
          scripts/run-aifeeds-staging-backfill.test.mjs
          deploy/nginx/*.test.mjs
          scripts/ci/performance-validation-contract.test.mjs
      - name: Validate nginx performance deployment helpers
        run: |
          python3 deploy/nginx/check-nginx-request-id.test.py
          python3 deploy/nginx/insert-nginx-request-id.test.py
          python3 deploy/nginx/verify-nginx-request-id-diff.test.py
          bash -n deploy/nginx/install-aifeeds-performance-log.sh
          bash -n deploy/nginx/rollback-aifeeds-performance-log.sh
          bash -n deploy/nginx/install-aifeeds-performance-log.integration.test.sh
      - name: Fault-inject the nginx performance installer
        run: bash deploy/nginx/install-aifeeds-performance-log.integration.test.sh
