# Complete perf-staging.ai-feeds.com server for the confirmed nginx 1.24 host.
#
# This isolated staging template contains no private credential. It deliberately
# uses resolver-backed variable proxy_pass targets because open-source nginx
# 1.24 cannot safely combine `upstream server ... resolve` with keepalive.
# Replace the HTTP-01 bootstrap with this file only after the certificate exists.

server {
    listen 80;
    listen [::]:80;
    server_name perf-staging.ai-feeds.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/aifeeds-certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://perf-staging.ai-feeds.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name perf-staging.ai-feeds.com;

    ssl_certificate /etc/letsencrypt/live/perf-staging.ai-feeds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/perf-staging.ai-feeds.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    resolver 1.1.1.1 1.0.0.1 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Both upstreams are public TLS services. Nginx does not verify proxy TLS
    # by default, so pin verification to Ubuntu's managed CA bundle.
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 2;

    # Keep this route before the SPA fallback. `$request_uri` preserves the
    # original /api/... path and query when proxy_pass contains a variable.
    location ^~ /api/ {
        # Feedback accepts one image up to 5 MiB plus multipart framing.
        client_max_body_size 6m;

        set $aifeeds_worker_host xlist-api-staging.ltsms86.workers.dev;
        proxy_pass https://$aifeeds_worker_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $aifeeds_worker_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $aifeeds_worker_host;

        proxy_set_header X-Forwarded-Host staging-api.ai-feeds.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;

        proxy_pass_header Set-Cookie;
        proxy_pass_header Server-Timing;
        proxy_pass_header X-Request-Id;

        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_redirect off;
    }

    # Match the authoritative production SEO route shape without the unknown
    # staging IndexNow key. Nginx evaluates this regex ahead of the plain `/`
    # prefix; `i/.*` intentionally sends /i/... to Worker while bare /i stays SPA.
    location ~ ^/(daily(/.*)?|i/.*|robots\.txt|sitemap\.xml|sitemap-[a-z0-9-]+\.xml|llms\.txt)$ {
        set $aifeeds_worker_host xlist-api-staging.ltsms86.workers.dev;
        proxy_pass https://$aifeeds_worker_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $aifeeds_worker_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $aifeeds_worker_host;

        proxy_set_header X-Forwarded-Host staging-api.ai-feeds.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;

        proxy_pass_header Set-Cookie;
        proxy_pass_header Server-Timing;
        proxy_pass_header X-Request-Id;

        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_redirect off;
    }

    # Cloudflare Pages serves the app shell, assets, and SPA deep links.
    location / {
        set $aifeeds_pages_host xlist-dashboard-perf.pages.dev;
        proxy_pass https://$aifeeds_pages_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $aifeeds_pages_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $aifeeds_pages_host;

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        # Never forward first-party session or bearer credentials to Pages.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Origin-Secret "";
        proxy_set_header X-Dev-Token "";
        proxy_set_header CF-Access-Client-Id "";
        proxy_set_header CF-Access-Client-Secret "";

        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_redirect off;
    }
}
