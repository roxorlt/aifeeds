server {
    listen 8080;
    server_name ai-feeds.com;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://127.0.0.1:9000;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:9000;
    }

    location /daily/ {
        proxy_pass http://127.0.0.1:9000;
    }
}

server {
    listen 8080;
    server_name api.ai-feeds.com;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location = /api/items {
        proxy_pass http://127.0.0.1:9000;
    }

    location = /api/stats {
        proxy_pass http://127.0.0.1:9000;
    }

    location = /api/sources {
        proxy_pass http://127.0.0.1:9000;
    }

    location = /api/feed-manifest {
        proxy_pass http://127.0.0.1:9000;
    }
}

server {
    listen 8080;
    server_name fonts.ai-feeds.com;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 204;
}

server {
    listen 8080;
    server_name perf-staging.ai-feeds.com;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 204;
}
