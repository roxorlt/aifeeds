# perf-staging.ai-feeds.com HTTP-01 bootstrap
#
# Install only while obtaining the first certificate. This isolated server
# never proxies application traffic and leaves every non-challenge path closed.

server {
    listen 80;
    listen [::]:80;
    server_name perf-staging.ai-feeds.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/aifeeds-certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
