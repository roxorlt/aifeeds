# ─────────────────────────────────────────────────────────────────────────────
# aifeeds SEO location —— 香港 VPS `ai-feeds.com` front server 块 SEO 段的权威副本
#
# 用途：把以下路径从主域 `ai-feeds.com` 转发到与 api 块**同一** worker upstream
#      （`xlist-api.ltsms86.workers.dev`），注入回源全套头；其余路径仍走 CF Pages。
#        - 日报静态页：/daily 深链与归档
#        - 视频观看页：/video/daily/<YYYY-MM-DD>
#        - 内容归档：/archive 按源/月/页的 crawlable 链接图
#        - SEO 文件：/robots.txt、/sitemap.xml、/video-sitemap.xml、/llms.txt、/<INDEXNOW_KEY>.txt
#        - sitemap 分片：/sitemap-<source>.xml、/sitemap-<source>-<n>.xml
#          （<source> ∈ daily|x|gh|ph|hf-paper|news，超 5 万续 -2 -3…）
#        - item SSR 静态页：/i/<source>/<id...>（如 /i/x/123、/i/gh/owner/repo；裸 /i 不放行）
#      **故意不启用 proxy_cache**（流量低，避开 2026-06-21 新旧 HTML 混喂缓存事故）。
#      worker 侧页面 canonical / 深链一律用 env `SITE_BASE`（https://ai-feeds.com），不依赖 request host。
#
# ⚠️ 这是**版本化副本，不是运行时配置**。改动后需 SSH 同步回 VPS：
#     1. 编辑 VPS `/etc/nginx/sites-available/aifeeds.conf` 里 front 块对应 location（先备份，
#        如 `aifeeds.conf.bak-YYYYMMDD-seo`）
#     2. `nginx -t`
#     3. `systemctl reload nginx`
#     完整部署 / 回滚步骤见 `docs/operations.md` §6b「2026-07-06 六续 / 2026-07-08 七续」+
#     设计 `docs/plans/2026-07-06-daily-static-page-seo-design.md` §4.10 +
#     `docs/plans/2026-07-08-item-ssr-pages-design.md` §4.4/§4.6。
#     回滚 = 删该 location 块 → `nginx -t && systemctl reload nginx`（worker 路由无状态，
#     删 nginx location 即回滚；api 域 `api.ai-feeds.com/daily`、`/i/...` 等仍可访问不受影响）。
#
# ⚠️ 放置位置：必须在 front（`ai-feeds.com`）server 块**内**、SPA fallback `location /` **之前**
#            （regex location 优先于 prefix location 匹配）。
#
# ⚠️ 与 PR #170（fix/seo-polish-ops，未 merge）的关系：
#     该分支已把本文件纳入 git 版本化（无 /i/ 与 sitemap 分片段），本分支（feat/item-ssr-pages）
#     基于 main 独立新建同名文件并直接写入**含 /i/ 与 sitemap 分片的完整正则**（超集）。
#     两分支各自 main 上都不存在此文件，**谁先 merge 谁「创建」，后 merge 一方会撞路径冲突**，
#     解决方式：取本文件（超集），把 #170 的其余非本文件改动（日报页缺页告警等）正常合入。
#
# ⚠️ 密钥不写此文件：
#     - `X-Origin-Secret` 真值取 `.secrets/aifeeds-prod.env` 的 `ORIGIN_SECRET`（回源密钥 gate，
#       见 operations.md §6b「🔐 回源密钥」）；此处为占位符。
#     - 正则里的 `<INDEXNOW_KEY>` 为占位符，替换成 `.secrets/aifeeds-prod.env` 的 `INDEXNOW_KEY`
#       真值（IndexNow 域名归属校验文件本就公开，但仍不在 repo 里写真值）。
#
# 权威性说明：本文件按 `docs/operations.md` §6b +
#   `docs/plans/2026-07-06-daily-static-page-seo-design.md` §4.10 +
#   `docs/plans/2026-07-08-item-ssr-pages-design.md` §4.4/§4.6 的描述重建。VPS 上 api 块的
#   **确切** proxy_set_header / proxy_ssl_* 行未在本机留存 —— 标 [TODO 待与 VPS 核对] 处需上 VPS
#   跑 `nginx -T` 抓 front/api 块原文后逐行对齐再回填（尤其 upstream 写法、SNI 行、超时/缓冲参数）。
#
# 三层口径对齐（本正则的放行范围必须与下列两处一致，改动时同步核对）：
#   - worker/src/seo-routes.ts  isSeoPath()          —— daily(/.*)? / video/daily/* / archive(/.*)? / i/* /
#                                                        sitemap.xml / video-sitemap.xml /
#                                                        sitemap-<source>(-<n>)?.xml / 根级 .txt
#   - dashboard/public/sw.js    isSeoPath()           —— 与上述公开路径保持同口径
# ─────────────────────────────────────────────────────────────────────────────

# daily 深链/归档 + 视频观看页 + 内容归档 + item SSR 静态页 + robots/sitemap(含视频与分片)/llms + IndexNow 校验文件
location ~ ^/(daily(/.*)?|video/daily/.*|archive(/.*)?|i/.*|robots\.txt|sitemap\.xml|video-sitemap\.xml|sitemap-[a-z0-9-]+\.xml|llms\.txt|<INDEXNOW_KEY>\.txt)$ {
    # 与 api 块同一 worker upstream（[TODO 待与 VPS 核对] upstream 写法对齐现有 api 段）
    proxy_pass https://xlist-api.ltsms86.workers.dev;

    # 照 api 块注入全套回源头
    proxy_set_header Host              xlist-api.ltsms86.workers.dev;                 # 上游 workers.dev Host
    proxy_set_header X-Forwarded-Host  api.ai-feeds.com;                              # worker 备用真实 host
    proxy_set_header X-Origin-Secret   "<ORIGIN_SECRET —— 见 .secrets/aifeeds-prod.env>";  # 回源密钥 gate
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # 到 workers.dev 的 TLS SNI（[TODO 待与 VPS 核对] 与 api 块确认确切写法）
    proxy_ssl_name        xlist-api.ltsms86.workers.dev;
    proxy_ssl_server_name on;

    # 故意不启用 proxy_cache（流量低，避开新旧 HTML 混喂缓存事故）。
    # 显式关缓存：万一 front server 块继承了 server 级 proxy_cache，这里强制不缓存。
    proxy_no_cache     1;
    proxy_cache_bypass 1;
}
