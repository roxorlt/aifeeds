# aifeeds same-origin API location (versioned template only)
#
# This is NOT a deployable runtime file. It is a placeholder-only location for
# the `perf-staging.ai-feeds.com` experiment server and, only after that passes,
# the production `ai-feeds.com` front server. Never install it verbatim.
#
# Render the three placeholders in a private, approved VPS change session:
#   __WORKER_UPSTREAM_HOST__  staging or production workers.dev upstream host
#   __PUBLIC_API_HOST__       staging-api.ai-feeds.com or api.ai-feeds.com
#   __ORIGIN_SECRET__         environment-specific Worker origin gate secret
#
# Secrets must never be committed, printed in review output, or copied back
# from the VPS. The exact live API-block headers/timeouts must be compared in
# the private session before this location is inserted. Full approval, render,
# validation, rollout, and rollback gates live in docs/operations.md §6b.
#
# Placement: inside only the intended public site front `server` block, before
# its SPA fallback `location /`. Do not add it to existing staging, admin,
# webhook, API, or unrelated virtual hosts.

location ^~ /api/ {
    # No URI suffix: preserve the original /api/... path and query exactly.
    proxy_pass https://__WORKER_UPSTREAM_HOST__;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Match the existing environment's API reverse-proxy identity and origin
    # gate. Cookie/Authorization are explicit because this route covers the
    # complete auth and mutation surface, not only anonymous list GETs.
    proxy_set_header Host              __WORKER_UPSTREAM_HOST__;
    proxy_set_header X-Forwarded-Host  __PUBLIC_API_HOST__;
    proxy_set_header X-Forwarded-Proto $scheme;
    # This VPS is the only trusted public hop for this route. Replace rather
    # than append so a client cannot spoof the first X-Forwarded-For value that
    # the origin-gated Worker uses for abuse controls and rate limits.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Origin-Secret   "__ORIGIN_SECRET__";
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header Cookie            $http_cookie;
    proxy_set_header Authorization     $http_authorization;
    proxy_pass_request_headers on;

    proxy_ssl_name        __WORKER_UPSTREAM_HOST__;
    proxy_ssl_server_name on;

    # Preserve the observability/auth response contract. Nginx normally passes
    # these already; explicit declarations protect this location if a parent
    # context later hides one of them. Never rewrite the upstream cookie domain
    # or path without a separate auth review.
    proxy_pass_header Set-Cookie;
    proxy_pass_header Server-Timing;
    proxy_pass_header X-Request-Id;

    # This task intentionally adds no API cache. Inherited front-server cache
    # settings must not cache auth, feedback, favorites, subscriptions, or any
    # other personalized/mutation response.
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_redirect off;
}
