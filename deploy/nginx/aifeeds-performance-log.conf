# aifeeds performance timing log
#
# This file contains only directives valid in nginx's http context. On the
# Ubuntu VPS it is installed verbatim under /etc/nginx/conf.d/. The host map
# deliberately excludes unrelated virtual hosts. Site-location request-id
# propagation and the guarded deployment procedure live in docs/operations.md.

map $host $aifeeds_performance_loggable {
    default             0;
    ai-feeds.com        1;
    api.ai-feeds.com    1;
    fonts.ai-feeds.com  1;
    perf-staging.ai-feeds.com 1;
}

# The benchmark supplies a per-run correlation value. Keep only the exact
# generated shape so an arbitrary client header cannot create unbounded or
# control-character-bearing log dimensions.
map $http_x_aifeeds_perf_probe $aifeeds_perf_probe {
    default "-";
    "~^upstream-[0-9]{10,16}-[A-Fa-f0-9]{8}$" $http_x_aifeeds_perf_probe;
}

# Normalize permanent share tokens before any path reaches the log formatter.
# The fixed admin maintenance route must precede its broader token route.
map $uri $aifeeds_safe_uri {
    ~^/api/admin/share/poster-cleanup$  /api/admin/share/poster-cleanup;
    ~^/api/admin/share/.+$              /api/admin/share/:token;
    ~^/api/share/poster/.+$             /api/share/poster/:token;
    ~^/s/.+$                            /s/:token;
    default                             $uri;
}

log_format aifeeds_performance escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"perf_probe":"$aifeeds_perf_probe",'
        '"host":"$host",'
        '"uri":"$aifeeds_safe_uri",'
        '"status":"$status",'
        '"request_time":"$request_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_cache_status":"$upstream_cache_status",'
        '"bytes_sent":"$bytes_sent",'
        '"user_agent":"$http_user_agent"'
    '}';

access_log /var/log/nginx/aifeeds-performance.jsonl aifeeds_performance if=$aifeeds_performance_loggable;
