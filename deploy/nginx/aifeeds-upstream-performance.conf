# TEMPLATE ONLY — DO NOT INCLUDE THIS FILE DIRECTLY.
#
# This file intentionally contains unresolved placeholders. A private,
# explicitly approved perf-staging session must first confirm `nginx -v/-V`
# supports dynamic upstream DNS (`server ... resolve`) before rendering it.
# Fixed Cloudflare IP addresses are forbidden.

upstream aifeeds_worker_keepalive_perf {
    zone aifeeds_worker_keepalive_perf 64k;
    resolver __TRUSTED_RESOLVER__ valid=30s ipv6=off;
    resolver_timeout 5s;
    server __WORKER_UPSTREAM_HOST__:443 resolve;

    keepalive 16;
    keepalive_timeout 30s;
    keepalive_requests 1000;
}

# Private render instructions for the existing Task 11 `location ^~ /api/`:
# replace only its proxy_pass target during the isolated A/B. Keep the real
# Worker hostname separate from the named upstream so TLS SNI and the origin
# gate do not receive `aifeeds_worker_keepalive_perf` as a host.
#
# proxy_pass https://aifeeds_worker_keepalive_perf;
# proxy_set_header Host __WORKER_UPSTREAM_HOST__;
# proxy_ssl_server_name on;
# proxy_ssl_name __WORKER_UPSTREAM_HOST__;
# proxy_set_header Connection "";
# proxy_http_version 1.1;
#
# The existing private X-Origin-Secret header remains in the rendered Task 11
# location. No secret value belongs in this repository template.

# Microcache is deliberately absent. Projection/index and topology-faithful
# perf-staging evidence do not yet meet its enablement gate. In particular this
# template must not inherit the shared image/media cache or cache personalized
# API responses.
proxy_cache off;
