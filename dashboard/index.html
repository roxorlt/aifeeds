<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="AI Feeds — 一站式 AI 信息聚合看板，聚合 X、GitHub、Product Hunt 等多源 AI 资讯" />
    <meta property="og:title" content="AI Feeds — 一站式 AI 信息聚合看板" />
    <meta property="og:description" content="聚合 X、GitHub、Product Hunt 等多源 AI 资讯，每日追踪 AI 领域动态。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ai-feeds.com/" />
    <meta property="og:image" content="https://ai-feeds.com/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Feeds — 一站式 AI 信息聚合看板" />
    <meta name="twitter:description" content="聚合 X、GitHub、Product Hunt 等多源 AI 资讯，每日追踪 AI 领域动态。" />
    <meta name="twitter:image" content="https://ai-feeds.com/og-default.png" />
    <link rel="preconnect" href="https://api.ai-feeds.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.ai-feeds.com" />
    <!-- 首屏冷启动数据预取:在 JS 还在下载/解析时就并行发起默认 feed(x_list)请求,让接口
         数据跟 JS 加载并行、而非「等 JS 跑完才发请求」的串行等待。命中由 fetchItems 用 path
         严格匹配消费(默认频道 = x_list / time 排序 / limit 30);其他频道或排序不匹配自动
         回退正常请求,失败(null)也回退,无副作用。 -->
    <script>
      (function () {
        try {
          var h = location.host, base = null;
          if (h === "ai-feeds.com" || h === "www.ai-feeds.com") base = "https://api.ai-feeds.com";
          else if (h.indexOf("staging") >= 0) base = "https://staging-api.ai-feeds.com";
          if (!base) return;
          var path = "/api/items?source_type=x_list&limit=30";
          window.__feedPrefetch = {
            path: path,
            promise: fetch(base + path, { credentials: "include" })
              .then(function (r) { return r.ok ? r.json() : null; })
              .catch(function () { return null; }),
          };
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.ai-feeds.com" crossorigin />
    <!-- 字体在 window.load 之后才注入：HarmonyOS Sans SC 已改 font-display: optional（品牌字体
         非必须），但若在加载窗口内引用，~38 个 woff2（~200KB）仍会后台下载、把 load 指标拖到 12s+、
         也跟首屏抢带宽。改成 load 之后空闲时才注入字体 CSS —— 字体不再算进 load、不抢首屏；首屏先用
         系统苹方（见 index.css fallback 栈）秒出，字体下完缓存供回访用。<noscript> 兜底 JS 关闭场景。 -->
    <script>
      window.addEventListener("load", function () {
        var inject = function () {
          ["regular", "medium", "bold"].forEach(function (w) {
            var l = document.createElement("link");
            l.rel = "stylesheet";
            l.href = "https://fonts.ai-feeds.com/hmos-" + w + "/result.css";
            document.head.appendChild(l);
          });
        };
        if (window.requestIdleCallback) window.requestIdleCallback(inject, { timeout: 3000 });
        else setTimeout(inject, 300);
      });
    </script>
    <noscript>
      <link rel="stylesheet" href="https://fonts.ai-feeds.com/hmos-regular/result.css" />
      <link rel="stylesheet" href="https://fonts.ai-feeds.com/hmos-medium/result.css" />
      <link rel="stylesheet" href="https://fonts.ai-feeds.com/hmos-bold/result.css" />
    </noscript>
    <title>AI Feeds — 一站式 AI 信息聚合看板</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
