<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AI Feeds 瀑布版 — 一个连续的多源 AI 信息流" />
    <meta name="aifeeds-build-id" content="__AIFEEDS_HOME_BUILD_IDENTITY__" />
    <link rel="canonical" href="https://ai-feeds.com/" />
    <meta name="theme-color" content="#fafafa" />
    <script>
      (() => {
        try {
          const sameOrigin = __AIFEEDS_API_SAME_ORIGIN__;
          const configuredBase = __AIFEEDS_API_BASE__;
          const host = location.hostname;
          let base = null;

          if (sameOrigin) base = "";
          else if (configuredBase) base = configuredBase;
          else if (host === "localhost" || host === "127.0.0.1" ||
                   host === "www.ai-feeds.com" || host === "perf-staging.ai-feeds.com") base = "";
          else if (host === "staging.ai-feeds.com" ||
                   host === "xlist-dashboard-staging.pages.dev" ||
                   host.endsWith(".xlist-dashboard-staging.pages.dev")) {
            base = "https://staging-api.ai-feeds.com";
          } else {
            base = "https://api.ai-feeds.com";
          }

          if (!base) return;
          ["preconnect", "dns-prefetch"].forEach((rel) => {
            const link = document.createElement("link");
            link.rel = rel;
            link.href = base;
            if (rel === "preconnect") link.crossOrigin = "anonymous";
            document.head.appendChild(link);
          });
        } catch (error) {}
      })();
    </script>
    <title>AI Feeds — 瀑布版</title>
  </head>
  <body>
    <div id="root"><!--__AIFEEDS_SSR_MARKUP__--></div>
    <script>
      (() => {
        const styleId = "aifeeds-waterfall-layout";
        const finiteCssNumber = (value, fallback) => {
          const parsed = Number.parseFloat(value);
          return Number.isFinite(parsed) ? parsed : fallback;
        };
        window.__aifeedsLayoutWaterfall = () => {
          const grid = document.querySelector(".waterfall-grid");
          if (!grid) return;
          const rootStyle = getComputedStyle(document.documentElement);
          const row = Math.max(
            1,
            finiteCssNumber(rootStyle.getPropertyValue("--waterfall-row"), 1),
          );
          const gap = Math.max(
            0,
            finiteCssNumber(rootStyle.getPropertyValue("--waterfall-gap"), 8),
          );
          const rules = Array.from(grid.querySelectorAll(".waterfall-card"))
            .map((card, index) => {
              const height = card.getBoundingClientRect().height;
              const span = Math.max(1, Math.ceil((height + gap) / (row + gap)));
              return `.waterfall-grid>.waterfall-card:nth-child(${index + 1})`
                + `{--waterfall-row-span:${span}!important}`;
            })
            .join("");
          let style = document.getElementById(styleId);
          if (!style) {
            style = document.createElement("style");
            style.id = styleId;
            document.head.append(style);
          }
          style.textContent = rules;
        };
        window.__aifeedsLayoutWaterfall();
      })();
    </script>
    <script id="aifeeds-initial-data" type="application/json">__AIFEEDS_INITIAL_DATA__</script>
    <script type="module" src="/src/waterfall-main.tsx"></script>
  </body>
</html>
