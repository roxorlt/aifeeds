# aifeeds D1 备份 worker — 独立于主业务 worker（xlist-api），用 CF Workflows 调
# D1 REST export API 拿 SQL dump，写到 R2 bucket aifeeds-d1-backups。
#
# 设计：docs/plans/2026-05-14-d1-backup-workflows-design.md
# 运维：docs/operations.md § 「D1 备份 worker」
#
# 部署：cd worker-backup && npx wrangler deploy
# 手动触发：curl -X POST https://aifeeds-d1-backup.<account>.workers.dev/trigger
#          (没绑自定义域，默认 workers.dev 子域)

name = "aifeeds-d1-backup"
main = "src/index.ts"
compatibility_date = "2026-05-14"
compatibility_flags = ["nodejs_compat"]

# Workflow 是 CF 自家的工作流编排，bound 进 worker 后通过 env.D1_BACKUP_WORKFLOW.create() 触发。
# Workers Paid $5/月含量已覆盖 — 计费跟 Workers Standard 一样（Requests / CPU-ms）。
[[workflows]]
name = "d1-backup-workflow"
binding = "D1_BACKUP_WORKFLOW"
class_name = "D1BackupWorkflow"

# R2 bucket 存 SQL dump — 用前需先在 CF dashboard / wrangler 创建：
# `wrangler r2 bucket create aifeeds-d1-backups`
# 配置 lifecycle rule 让 daily/ 30 天后自动删（dashboard：R2 → bucket → Object lifecycle）。
[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "aifeeds-d1-backups"

# 公开值（CF account ID + D1 database ID 都在 wrangler.toml 等多处出现，不算 secret）。
# D1_BACKUP_API_TOKEN 是 secret，用 wrangler secret put 注入，不在 vars 里。
[vars]
CF_ACCOUNT_ID = "0d13b65d05d5d29fe06998141f3b0f9a"
D1_DATABASE_ID = "2973d54b-ca13-48e4-8d20-1430c57f5260"  # prod xlist db

# UTC 04:30 = BJT 12:30。每天一次。
# 选这个时间因为：① 业务低峰（中午用户活跃但抓取压力小），② 避开主 worker 的 */5 cron 的整点峰值
[triggers]
crons = ["30 4 * * *"]

# ─────────────────── Staging 环境（可选，验证用） ───────────────────
# 部署：wrangler deploy --env staging
# 备份目标：staging D1 (xlist-staging)，写到 R2 aifeeds-d1-backups-staging
[env.staging]
name = "aifeeds-d1-backup-staging"
compatibility_flags = ["nodejs_compat"]

[[env.staging.workflows]]
name = "d1-backup-workflow-staging"
binding = "D1_BACKUP_WORKFLOW"
class_name = "D1BackupWorkflow"

[[env.staging.r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "aifeeds-d1-backups-staging"

[env.staging.vars]
CF_ACCOUNT_ID = "0d13b65d05d5d29fe06998141f3b0f9a"
D1_DATABASE_ID = "fc029d89-6871-4e5c-b653-7ed27e6fb649"  # staging xlist-staging db

# Staging cron 关闭，要测时用 /trigger 手动调
[env.staging.triggers]
crons = []
