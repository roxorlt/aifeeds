name = "xlist-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# nodejs_compat: required by @cloudflare/puppeteer (uses node:buffer internally)
compatibility_flags = ["nodejs_compat"]

# PR5 share poster：把 woff2 字体子集 + resvg wasm 当二进制 asset 打进 worker bundle。
# *.wasm 走 wrangler 默认的 CompiledWasm rule（返回 WebAssembly.Module，给 resvg initWasm 用）。
# *.woff2 加 Data rule，import 出 ArrayBuffer / Uint8Array。
[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "xlist"
database_id = "2973d54b-ca13-48e4-8d20-1430c57f5260"

# README 图片/视频迁移落库（v2.3）。
# 通过 Worker /r/<key> 端点对外提供（避免 R2 公网域名管理 + 加 cache headers）。
[[r2_buckets]]
binding = "READMES"
bucket_name = "xlist-readme-assets"

[[kv_namespaces]]
binding = "AUTH_KV"
id = "07d666433fef483a9457146f7d5a62d5"
preview_id = "78f0a9567d434d8b87c71cc29eea88f9"

# CF Browser Rendering 试过(2026-05-18)再 verified arxiv 对 headless 也 detect,
# 改走 PDF parse(figure-pdf.ts,unzlibSync 修复后 92.9% per-paper 命中率)。binding 移除。

[vars]
# 邮件链接基址:回流/退订走 worker API 域(API_BASE),落地深链走前端域(SITE_BASE)
SITE_BASE = "https://ai-feeds.com"
API_BASE = "https://api.ai-feeds.com"
# email auth 默认值（RESEND_API_KEY secret 通过 wrangler secret put 配置，不入 vars）
EMAIL_DAILY_CAP = "100"
EMAIL_MONTHLY_CAP = "3000"
EMAIL_FROM = "AI Feeds <noreply@mail.ai-feeds.com>"
ENABLE_SMS_LOGIN = "false"       # 备案后翻 true
ENABLE_EMAIL_LOGIN = "true"
# CF Access JWT 校验（admin 入口）。AUD 走 wrangler secret put（每环境不同 app）。
# 缺 AUD secret 时 admin.checkAdminAuth 自动回落到 ADMIN_USER/PASS Basic Auth。
CF_ACCESS_TEAM_DOMAIN = "https://aifeeds.cloudflareaccess.com"
# 官方新闻源 RSSHub 基址(feeds/parse.ts via='rsshub' 用)。2026-06-22 Phase 2 接入
# 4 个小宇宙中文播客,经 Codex 在 HK VPS 自托管的 token-gated RSSHub(rss.ai-feeds.com)。
# token 走 wrangler secret put RSSHUB_TOKEN;staging 也设、共用同一实例验证。
RSSHUB_BASE = "https://rss.ai-feeds.com"

[triggers]
crons = ["*/5 * * * *"]

# Workers Logs（CF Dashboard → Workers → xlist-api → Logs）。
# 启用后可搜近 3 天的 console.log / 异常堆栈 / 请求 metadata，按 rayId / status / 时间过滤。
# invocation_logs = true 让每次 invocation 都有日志（含 path / status / duration），
# 不依赖业务代码主动 console.log。
[observability]
enabled = true
head_sampling_rate = 1.0

[observability.logs]
invocation_logs = true

# CF Workflow: GH 抓取链。Phase 1 cron 抓 trending 后，为每个新 repo create
# 1 个 instance。4 step pipeline: enrich-metadata → classify-with-llm →
# r2-migrate-assets → translate-readme。设计文档：docs/plans/2026-05-16-github-pipeline-workflows-design.md
[[workflows]]
name = "github-pipeline-workflow"
binding = "GITHUB_PIPELINE_WORKFLOW"
class_name = "GithubPipelineWorkflow"

# CF Workflow: X 主链。runListPollIngest 拉 list 后对每条新 tweet create
# 1 个 instance。Step 1 classify → step 2 fan-out (backfill quote/reply + check
# longform) → step 3 longform-via-sb (条件) → step 4 fan-out (翻译多字段)。
# 设计文档：docs/plans/2026-05-16-x-main-pipeline-workflows-design.md
[[workflows]]
name = "x-tweet-pipeline-workflow"
binding = "X_TWEET_PIPELINE_WORKFLOW"
class_name = "XTweetPipelineWorkflow"

# CF Workflow: Product Hunt 抓取链。runPhDailyFetch 后对每条新 post create instance。
# 3 step: classify-with-llm → r2-migrate → translate-fields。
# 设计：docs/plans/2026-05-16-ph-clawhub-workflow-design.md
[[workflows]]
name = "ph-pipeline-workflow"
binding = "PH_PIPELINE_WORKFLOW"
class_name = "PhPipelineWorkflow"

# CF Workflow: ClawHub 抓取链。runClawhubFetchList 后对每条新 skill create instance。
# 2 step: enrich-and-translate (Promise.all 内 3 件并行) → persist。
[[workflows]]
name = "clawhub-pipeline-workflow"
binding = "CH_PIPELINE_WORKFLOW"
class_name = "ClawhubPipelineWorkflow"

# CF Workflow: 活动行 (huodongxing) detail 抓取。runHuodongxingFetchList 后对
# 每条新事件 create 1 个 instance，跑 4 step pipeline: throttle sleep →
# ensure-cookies → fetch-and-parse-detail → persist。
# 设计文档：docs/plans/2026-05-16-huodongxing-workflow-design.md
[[workflows]]
name = "huodongxing-detail-workflow"
binding = "HUODONGXING_DETAIL_WORKFLOW"
class_name = "HuodongxingDetailWorkflow"

# CF Workflow: HuggingFace Daily Papers 抓取链(worker/src/workflows/hf-paper-pipeline.ts)。
# runHfDailyFetch(daily cron BJT 08:00)后对每条 new paper create 1 个 instance,
# 跑 8-step fan-out pipeline:
#   step 0  refresh-paper-detail + fetch-arxiv-categories
#   step 1  fan-out(backfill-media-r2 + refresh-gh-star + fetch-ar5iv-and-extract-figure
#                   + fetch-discussion[svelte_ssr])
#   step 2  translate-ar5iv + translate-discussion-comments(flash 批量)
#   step 3  fan-out(8 段 deep_analysis pro reasoning + 1 次 flash translate-title-summary
#                   + merge-deep-analysis)
#   step 4  完整性 gate(workflow_completed_at,允许 ≤2 段 failed)
# 设计文档:docs/plans/2026-05-18-hf-daily-papers-source-design.md §4
[[workflows]]
name = "hf-paper-pipeline-workflow"
binding = "HF_PAPER_PIPELINE_WORKFLOW"
class_name = "HfPaperPipelineWorkflow"

# CF Workflow: 官方新闻 — blog 厂商博客抓取链(worker/src/workflows/blog-pipeline.ts)。
# runBlogFetch(cron :20 偶数时)后对每条新文章 create 1 个 instance，跑
# ensure-excerpt → is_ai gate → extract-fulltext + reclassify → enrich(classify+
# translate) → media-r2 → dedup → mark-completed。
# 设计：docs/plans/2026-06-09-ai-vendor-feeds-source-design.md §8
[[workflows]]
name = "blog-pipeline-workflow"
binding = "BLOG_PIPELINE_WORKFLOW"
class_name = "BlogPipelineWorkflow"

# CF Workflow: 官方新闻 — podcast AI 播客抓取链(worker/src/workflows/podcast-pipeline.ts)。
# runPodcastFetch(cron :50 UTC 1/7/13/19)后对每集 create 1 个 instance，跑
# ensure-shownotes → is_ai gate → 原生文字稿(A 档)→ enrich → cover-r2 → dedup →
# mark-completed。音频 enclosure 直链不迁 R2。
[[workflows]]
name = "podcast-pipeline-workflow"
binding = "PODCAST_PIPELINE_WORKFLOW"
class_name = "PodcastPipelineWorkflow"

# CF Workflow: 订阅推送(worker/src/digest/)。scheduled handler 在节点(UTC 0/4/9)
# create node-run;node-run Phase 2 对每个订阅 create deliver。
# 设计:roxor-main-design-20260528-090625.md
[[workflows]]
name = "digest-node-run-workflow"
binding = "DIGEST_NODE_RUN_WORKFLOW"
class_name = "DigestNodeRunWorkflow"

[[workflows]]
name = "digest-deliver-workflow"
binding = "DIGEST_DELIVER_WORKFLOW"
class_name = "DigestDeliverWorkflow"

# ─────────────────── Staging 环境 ───────────────────
# 部署：wrangler deploy --env staging
# 设计：docs/plans/2026-05-03-staging-environment-design.md
[env.staging]
name = "xlist-api-staging"
compatibility_flags = ["nodejs_compat"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "xlist-staging"
database_id = "fc029d89-6871-4e5c-b653-7ed27e6fb649"

[[env.staging.r2_buckets]]
binding = "READMES"
bucket_name = "xlist-readme-assets-staging"

[[env.staging.kv_namespaces]]
binding = "AUTH_KV"
id = "76f7a326a94c4b8685668e39a23b3fe9"
preview_id = "f187810317a845eca4b20f6e7b357a79"

# browser binding 移除(走 PDF parse 替代)

[env.staging.vars]
# 邮件链接基址(staging 域名,避免 staging 测的邮件指到 prod)
SITE_BASE = "https://staging.ai-feeds.com"
API_BASE = "https://staging-api.ai-feeds.com"
# email auth 默认值（RESEND_API_KEY secret 通过 wrangler secret put 配置，不入 vars）
EMAIL_DAILY_CAP = "100"
EMAIL_MONTHLY_CAP = "3000"
EMAIL_FROM = "AI Feeds <noreply@mail.ai-feeds.com>"
ENABLE_SMS_LOGIN = "false"       # 备案后翻 true
ENABLE_EMAIL_LOGIN = "true"
# CF Access JWT 校验（admin 入口）。AUD 走 wrangler secret put（每环境不同 app）。
CF_ACCESS_TEAM_DOMAIN = "https://aifeeds.cloudflareaccess.com"
# 2026-05-17 X workflow 重构:启用完整性 gate filter,筛掉 workflow_completed_at IS NULL 的 X 数据
# prod 默认关(等批 4 backfill 老数据完成后再开,见 docs/plans/2026-05-17-x-workflow-rollout-plan.md)
WORKFLOW_COMPLETED_FILTER = "true"
# RSSHub 基址(2026-06-22 Phase 2 中文播客);与 prod 共用同一 rss.ai-feeds.com 实例 + 同一 token 验证
RSSHUB_BASE = "https://rss.ai-feeds.com"

# Staging cron 默认全关，要手动测时再放开
[env.staging.triggers]
crons = []

# Workers Logs（同 prod 启用）
[env.staging.observability]
enabled = true
head_sampling_rate = 1.0

[env.staging.observability.logs]
invocation_logs = true

# CF Workflow（同 prod 启用，独立 name 避免跨 env 复用 instance state）
[[env.staging.workflows]]
name = "github-pipeline-workflow-staging"
binding = "GITHUB_PIPELINE_WORKFLOW"
class_name = "GithubPipelineWorkflow"

[[env.staging.workflows]]
name = "x-tweet-pipeline-workflow-staging"
binding = "X_TWEET_PIPELINE_WORKFLOW"
class_name = "XTweetPipelineWorkflow"

[[env.staging.workflows]]
name = "huodongxing-detail-workflow-staging"
binding = "HUODONGXING_DETAIL_WORKFLOW"
class_name = "HuodongxingDetailWorkflow"

[[env.staging.workflows]]
name = "ph-pipeline-workflow-staging"
binding = "PH_PIPELINE_WORKFLOW"
class_name = "PhPipelineWorkflow"

[[env.staging.workflows]]
name = "clawhub-pipeline-workflow-staging"
binding = "CH_PIPELINE_WORKFLOW"
class_name = "ClawhubPipelineWorkflow"

[[env.staging.workflows]]
name = "hf-paper-pipeline-workflow-staging"
binding = "HF_PAPER_PIPELINE_WORKFLOW"
class_name = "HfPaperPipelineWorkflow"

[[env.staging.workflows]]
name = "blog-pipeline-workflow-staging"
binding = "BLOG_PIPELINE_WORKFLOW"
class_name = "BlogPipelineWorkflow"

[[env.staging.workflows]]
name = "podcast-pipeline-workflow-staging"
binding = "PODCAST_PIPELINE_WORKFLOW"
class_name = "PodcastPipelineWorkflow"

[[env.staging.workflows]]
name = "digest-node-run-workflow-staging"
binding = "DIGEST_NODE_RUN_WORKFLOW"
class_name = "DigestNodeRunWorkflow"

[[env.staging.workflows]]
name = "digest-deliver-workflow-staging"
binding = "DIGEST_DELIVER_WORKFLOW"
class_name = "DigestDeliverWorkflow"

# Staging worker 自定义域。需要 zone 已加 ai-feeds.com（已加）；
# wrangler deploy 时自动注册 + 配 DNS（CF managed）。
[[env.staging.routes]]
pattern = "staging-api.ai-feeds.com"
custom_domain = true
