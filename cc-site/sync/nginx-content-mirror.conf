# Managed by the repository deployment scripts. This file is included from
# the existing ai-feeds.cc HTTPS server block and intentionally does not define
# or replace /auth/wechat/.

location ^~ /i/ {
    try_files $uri $uri/ $uri/index.html =404;
    add_header Cache-Control "public, max-age=600" always;
}

location ^~ /ai-news/ {
    root /var/lib/aifeeds-cc-sync/public/current;
    try_files $uri $uri/ $uri/index.html =404;
    add_header Cache-Control "public, max-age=600" always;
}

location = /sitemap.xml {
    alias /var/lib/aifeeds-cc-sync/public/current/sitemap.xml;
    default_type application/xml;
    add_header Cache-Control "public, max-age=600" always;
}

location = /sitemap-cn.xml {
    alias /var/lib/aifeeds-cc-sync/public/current/sitemap-cn.xml;
    default_type application/xml;
    add_header Cache-Control "public, max-age=600" always;
}

location ~ "\A/sitemap-cn-(?<part>(?!0000)[0-9]{4})\.xml\z" {
    alias /var/lib/aifeeds-cc-sync/public/current/sitemap-cn-$part.xml;
    default_type application/xml;
    add_header Cache-Control "public, max-age=600" always;
}

location ~ "\A/sitemap-cn(?:-[^/]*)?\.xml\z" {
    return 404;
}

location ~ "\A/sitemaps/(?<generation>[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/(?<sitemap>(?:archive|(?:news|x|gh|ph|hf-paper)-[1-9][0-9]*)\.xml)\z" {
    alias /var/lib/aifeeds-cc-sync/public/generations/$generation/sitemaps/$sitemap;
    default_type application/xml;
    add_header Cache-Control "public, max-age=600" always;
}

location ~ "\A/sitemaps/" {
    return 404;
}
