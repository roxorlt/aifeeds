# fail2ban jail for ai-feeds.cc 微信登录中转 —— 与香港 VPS 防护层对齐
# 放 /etc/fail2ban/jail.d/aifeeds-relay.conf（或合并进 jail.local），然后：
#   systemctl restart fail2ban && fail2ban-client status
#
# 依赖 nginx 限流（nginx-auth-wechat.conf）：反复撞 429 的 IP 会在 error.log 留
# "limiting requests" 行，本 jail 扫它 → 短时间内多次触发 → 封禁。
# 与香港 VPS 的 nginx-limit-req jail 同款思路。

[nginx-limit-req-cc]
enabled  = true
filter   = nginx-limit-req
# 宝塔 nginx 错误日志路径（按实际改；宝塔默认每站独立日志在 /www/wwwlogs/）
logpath  = /www/wwwlogs/ai-feeds.cc.error.log
# 1 分钟内触发限流 ≥ 30 次 → 封 1 小时
findtime = 60
maxretry = 30
bantime  = 3600
# 管理 IP 加白（填你的固定出口 IP，避免误伤自己；多个空格分隔）
# ignoreip = 127.0.0.1/8 ::1 你的管理IP

# SSH 防爆破（系统已禁密码登录，这层是兜底）。多数发行版默认已有 sshd jail，
# 若 jail.local 里没有可启用这段。
[sshd-cc]
enabled  = true
filter   = sshd
backend  = systemd
findtime = 600
maxretry = 5
bantime  = 3600
