# ai-feeds.cc 微信登录中转：nginx 反代 + 限流片段
# ─────────────────────────────────────────────────────────────
# .cc 服务器（腾讯云宝塔，82.156.0.68）的 ai-feeds.cc DNS 直连本机（无 CDN/中转），
# 所以 $remote_addr / $binary_remote_addr 就是真实用户 IP，限流直接按它。
#
# 两段分别放不同位置（宝塔环境，实测路径 2026-06-02）：
#   【A 段】limit_req_zone：http 块级别 —— 新建 /www/server/panel/vhost/nginx/0.wechat-ratelimit.conf
#           （该目录被 nginx.conf 的 http 块 include *.conf；0. 前缀确保先加载。
#            宝塔已有同级的 0.websocket.conf，是同款 http 级 helper）
#   【B 段】location：放 ai-feeds.cc 的 server 块 —— 站点配置
#           /www/server/panel/vhost/nginx/html_ai-feeds.cc.conf 的 #REWRITE-END 之后
#           （基础反代 location 已在部署时插入，本段是在它上面叠加 limit_req/limit_conn）
#
# 改完：nginx -t && nginx -s reload

# ═══ 【A 段】放 http 块（conf.d/aifeeds-relay.conf）═══
# 每 IP 10 req/s 限流区，10m 内存约存 16 万 IP。故意宽松照顾中国 CGNAT（多真实用户共享公网 IP）。
limit_req_zone $binary_remote_addr zone=wechat_auth:10m rate=10r/s;
# 每 IP 并发连接上限区
limit_conn_zone $binary_remote_addr zone=wechat_conn:10m;


# ═══ 【B 段】放 ai-feeds.cc 的 server 块（443 那个）═══
# 注意：要放在静态 location / 之前，确保 /auth/wechat/ 优先命中。
location /auth/wechat/ {
    # 限流：突发允许 20，nodelay 不排队直接放行（超出才 503）；并发每 IP ≤10
    limit_req zone=wechat_auth burst=20 nodelay;
    limit_conn wechat_conn 10;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    # 真实用户 IP 透传给中转进程（relay.mjs getClientIp 读 X-Real-IP / X-Forwarded-For）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # OAuth 跳转要快返回；上游异常别长挂
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    # 登录回调严禁缓存
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store" always;
}
