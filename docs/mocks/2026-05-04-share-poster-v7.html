<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI-Feeds 分享海报 v7 · flex 自适应高度</title>
<style>
  :root {
    --page-bg: #eef1f5;
    --poster-bg: #f6f7fa;
    --ink: #111318;
    --muted: #687084;
    --muted2: #98a0af;
    --line: rgba(15, 23, 42, .085);
    --purple: #6d4bd8;
    --purple-soft: #f3eeff;
    --green: #2da866;
    --green-soft: rgba(46,170,104,.10);
    --blue: #397cff;
    --blue-soft: rgba(59,124,255,.10);
    --orange: #ff653f;
    --orange-soft: #fff0eb;
    --card: #fff;
    --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--page-bg); color:var(--ink); font-family:var(--font); }
  .toolbar { position:sticky; top:0; z-index:20; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; background:rgba(247,248,251,.92); backdrop-filter:blur(18px); border-bottom:1px solid rgba(15,23,42,.08); }
  .toolbar h1 { margin:0; font-size:16px; letter-spacing:-.02em; }
  .toolbar p { margin:4px 0 0; color:var(--muted); font-size:12px; }
  .toolbar code { padding:2px 7px; border-radius:8px; background:#fff; border:1px solid var(--line); }
  .gallery { max-width:1460px; margin:0 auto; padding:28px; display:grid; grid-template-columns:repeat(auto-fit,minmax(380px,1fr)); gap:32px; align-items:start; }
  .poster-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .caption { width:390px; display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:13px; }
  .caption b { color:var(--ink); }
  /* viewport 缩放容器 — 高度由 JS 动态测量 poster 后设置（自适应海报实际高度） */
  .poster-viewport { width:390px; border-radius:22px; overflow:hidden; box-shadow:0 22px 80px rgba(15,23,42,.18); background:var(--poster-bg); position:relative; }

  /* 海报 1080 宽 / 高度由内容撑开 / scale 0.361 缩到 390 宽 */
  .poster {
    width:1080px;
    transform:scale(.361111);
    transform-origin:0 0;
    background:var(--poster-bg);
    display:flex;
    flex-direction:column;
    isolation:isolate;
    position:relative;
  }

  /* ── HERO 顶部黑色品牌区 ─────────────────────────────── */
  /* mask 椭圆 horizontal-radius=100%（=540px 半宽），50% transparent → 弧形两端
     正好贴 hero 左下角 (0, 底) 和右下角 (1080, 底)；vertical-radius 200 → 弧形深 100px
     hero 加高到 360 让 bg 下边沿往下，黑色区域更多 */
  .hero {
    height:360px;
    position:relative;
    z-index:1;
    padding:60px 70px 0 70px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:32px;
    color:#fff;
    overflow:hidden;
  }
  .hero::before {
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 82% 22%, rgba(111,99,255,.34), transparent 22%),
      linear-gradient(180deg,#050505 0%,#0c0c10 100%);
    -webkit-mask-image: radial-gradient(ellipse 100% 200px at 50% 100%, transparent 50%, #000 51%);
            mask-image: radial-gradient(ellipse 100% 200px at 50% 100%, transparent 50%, #000 51%);
    z-index:0;
  }
  .hero::after {
    content:"";
    position:absolute;
    top:-170px; right:-240px;
    width:740px; height:740px;
    border-radius:50%;
    background:repeating-radial-gradient(circle,transparent 0 42px,rgba(255,255,255,.08) 45px 47px);
    opacity:.5;
    pointer-events:none;
    z-index:0;
  }
  .hero > * { position:relative; z-index:1; }
  .hero-logo { width:104px; height:104px; flex:0 0 auto; }
  /* 旧 hero-curve / mask 方案弃用，回到 content-card 圆角咬合 hero 矩形的方案 */
  .hero-brand { display:flex; align-items:center; gap:30px; z-index:3; }
  /* hero-logo 已在上方更新到 104px */
  .hero-logo img { width:100%; height:100%; display:block; }
  .hero-name { margin:0; font-size:62px; line-height:1; font-weight:950; letter-spacing:-.04em; }
  .hero-slogan { margin:14px 0 0; font-size:28px; line-height:1; font-weight:600; color:rgba(255,255,255,.66); letter-spacing:.04em; }
  .hero-source { z-index:3; align-self:flex-start; margin-top:20px; }
  .hero-source .source-chip {
    display:inline-flex;
    align-items:center;
    gap:14px;
    padding:18px 32px;
    border-radius:999px;
    font-size:32px;
    font-weight:850;
    line-height:1;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.18);
    color:#fff;
    backdrop-filter:blur(12px);
  }
  .hero-source .source-chip::before { content:"来源"; font-size:24px; font-weight:600; opacity:.65; }

  /* ── 内容卡 ───────────────────────────────────────── */
  .content-card {
    margin:-130px 56px 0;         /* overlap 130：卡片顶嵌入 hero 黑色区域（约 brand 底之下 66px），弧形大部分被覆盖、仅卡片左右两侧底部露出弧形透明区 */
    z-index:4;
    background:#fff;
    border:1px solid rgba(15,23,42,.06);
    border-radius:48px;
    box-shadow:0 34px 96px rgba(15,23,42,.13);
    padding:64px 58px 42px;
    display:flex;
    flex-direction:column;
    gap:30px;
    overflow:hidden;
    position:relative;
  }
  .content-card * { min-width:0; }

  /* ── Footer 分享区 ──────────────────────────────── */
  .footer {
    margin:48px 56px 56px;
    background:#fff;
    border:1px solid rgba(15,23,42,.05);
    border-radius:40px;
    box-shadow:0 22px 66px rgba(15,23,42,.09);
    display:grid;
    grid-template-columns:minmax(0,1fr) 220px;
    gap:36px;
    align-items:center;
    padding:36px 44px;
    overflow:hidden;
    z-index:3;
  }
  .sharer { display:flex; align-items:center; gap:28px; min-width:0; }
  .sharer-avatar {
    width:120px; height:120px;
    flex:0 0 auto;
    border-radius:999px;
    background:#f4f4f6;
    overflow:hidden;
  }
  .sharer-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .sharer-meta { min-width:0; }
  .sharer-meta small { display:block; font-size:26px; color:var(--muted); line-height:1; }
  .sharer-meta strong { display:block; font-size:36px; font-weight:400; line-height:1.1; letter-spacing:0; margin-top:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink); }
  .qr-area {
    display:grid;
    grid-template-rows:168px 24px;
    align-items:center;
    justify-items:end;
    gap:12px;
  }
  .qr-box { width:168px; height:168px; border-radius:18px; border:1px solid rgba(15,23,42,.08); overflow:hidden; background:#fff; }
  .qr-svg { width:100%; height:100%; display:block; }
  .qr-scan { color:var(--muted2); font-size:22px; line-height:1; white-space:nowrap; }

  /* ── 通用 chips / pills ───────────────────────── */
  .pill { display:inline-flex; align-items:center; justify-content:center; gap:12px; max-width:100%; width:max-content; padding:12px 24px; border-radius:999px; background:var(--purple-soft); color:#5d3ed0; font-size:32px; line-height:1; font-weight:850; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pill.small { font-size:28px; padding:10px 20px; }
  .pill.tiny { font-size:24px; padding:10px 17px; }
  .pill.soft { background:#f2f3f6; color:var(--muted); }
  .pill.green { background:var(--green-soft); color:var(--green); }
  .pill.blue { background:var(--blue-soft); color:var(--blue); }
  .pill.orange { background:var(--orange-soft); color:#f0542e; }

  /* hero source-chip 在 hero 上不同色调，content-card 内不需额外区分 */
  .source-chip.x { color:#fff; }
  .source-chip.github { color:#c1f0d8; }
  .source-chip.ph { color:#ffd1c1; }

  /* ── X 内容 ──────────────────────────────────── */
  .top-line { display:flex; justify-content:space-between; align-items:flex-start; gap:28px; }
  .author { display:flex; align-items:center; gap:24px; min-width:0; }
  .avatar { width:112px; height:112px; flex:0 0 auto; display:grid; place-items:center; border-radius:28px; background:#f4f4f6; overflow:hidden; }
  .name-row { display:flex; align-items:center; gap:12px; min-width:0; }
  .name { font-size:52px; line-height:1; font-weight:950; letter-spacing:-.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .handle { margin-top:14px; color:var(--muted); font-size:36px; line-height:1; max-width:560px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .verified { width:40px; height:40px; flex:0 0 auto; border-radius:999px; display:grid; place-items:center; background:#18a7f4; color:#fff; font-size:24px; font-weight:950; }

  .headline { margin:0; font-size:70px; line-height:1.12; letter-spacing:-.06em; font-weight:950; overflow-wrap:anywhere; word-break:break-word; }
  .headline.repo-title-text { font-size:66px; line-height:1.08; }
  .headline.product-title-text { font-size:92px; line-height:.95; }
  .body-text {
    margin:0;
    font-size:38px;
    line-height:1.52;
    color:#111318;             /* 加深正文颜色让内容更突出 */
    font-weight:500;           /* medium 让正文比 metric 数字更"重" */
    letter-spacing:-.015em;
    overflow-wrap:anywhere;
    word-break:break-word;
    display:-webkit-box;
    -webkit-line-clamp:5;
    -webkit-box-orient:vertical;
    overflow:hidden;
    text-overflow:ellipsis;
    max-height:calc(1.52em * 5);
  }
  .compact-body { font-size:36px; line-height:1.48; max-height:calc(1.48em * 5); }

  .engagement { display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line); padding-top:30px; color:#687084; font-size:30px; }
  .engagement div { display:flex; align-items:center; justify-content:center; gap:12px; border-right:1px solid rgba(15,23,42,.08); white-space:nowrap; overflow:hidden; }
  .engagement div:last-child { border-right:0; }

  .metric-row,.ph-stats { display:grid; grid-template-columns:repeat(3,1fr); border-bottom:1px solid var(--line); padding-bottom:24px; }
  .metric-row div,.ph-stats div { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; border-right:1px solid var(--line); min-height:96px; text-align:center; font-size:32px; color:var(--muted); }
  .metric-row div:last-child,.ph-stats div:last-child { border-right:0; }
  /* 数字比正文 38 略小且更轻，让正文更突出 */
  .metric-row b,.ph-stats b { font-size:34px; line-height:1; font-weight:700; color:var(--ink); }
  .metric-row small,.ph-stats small { font-size:24px; color:var(--muted2); line-height:1; font-weight:500; }

  .meta-row { display:grid; grid-template-columns:1fr 330px; gap:28px; align-items:center; color:var(--muted); font-size:30px; padding-bottom:22px; border-bottom:1px solid var(--line); overflow:hidden; }
  .meta-row .trophy-icon { color:#f59e0b; }  /* trophy 金色，跟 dashboard GH card daily_rank 一致 */
  .meta-row span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .contrib { display:flex; align-items:center; gap:0; overflow:hidden; }
  .contrib i { width:38px; height:38px; border-radius:999px; border:3px solid #fff; margin-left:-12px; background:linear-gradient(135deg,#a3bffa,#f9a8d4); flex:0 0 auto; }
  .contrib i:first-child { margin-left:0; }

  /* X media chart preview */
  .chart-preview { border:1px solid rgba(15,23,42,.10); border-radius:34px; padding:30px; background:linear-gradient(180deg,#fff,#fbfbff); overflow:hidden; }
  .mini-charts { display:grid; grid-template-columns:repeat(4,1fr); gap:22px 18px; }
  .mini-chart { min-height:128px; display:flex; flex-direction:column; justify-content:flex-end; gap:8px; }
  .mini-chart h4 { margin:0; font-size:20px; line-height:1; text-align:center; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bars { height:84px; border-bottom:1px solid rgba(15,23,42,.12); display:flex; justify-content:center; align-items:flex-end; gap:10px; }
  .bar { display:block; width:20px; border-radius:5px 5px 0 0; background:#d8d3f6; }
  .bar.main { background:linear-gradient(180deg,#8e66db,#6f49cd); }
  .bar.google { background:#e7ecef; }
  .legend { margin-top:18px; display:flex; justify-content:center; gap:28px; color:#596071; font-size:20px; flex-wrap:wrap; }
  .legend i { display:inline-block; width:34px; height:10px; border-radius:999px; background:#8e66db; margin-right:8px; }
  .legend .l2 { background:#d9d2f8; } .legend .l3 { background:#e7ecef; }

  /* GitHub */
  .repo-title { display:grid; grid-template-columns:128px minmax(0,1fr); gap:34px; align-items:start; }
  .repo-logo { width:128px; height:128px; border-radius:999px; background:#08090a; display:grid; place-items:center; overflow:hidden; }
  .repo-dot-logo { width:96px; height:96px; display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .repo-dot-logo i { border-radius:50%; background:rgba(18,185,129,.22); }
  .repo-dot-logo i.on { background:#12b981; }
  .repo-name-wrap { min-width:0; overflow:hidden; }
  .category-line { margin-top:16px; display:flex; justify-content:flex-start; align-items:center; gap:12px; overflow:hidden; }

  /* PH */
  .product-header { display:grid; grid-template-columns:128px minmax(0,1fr); gap:34px; align-items:start; }
  .product-logo { width:128px; height:128px; border-radius:30px; border:1px solid rgba(15,23,42,.08); background:#fbfbfc; display:grid; place-items:center; overflow:hidden; }
  .product-info { min-width:0; overflow:hidden; }
  .product-title-row { display:flex; gap:22px; align-items:baseline; min-width:0; }
  .rank { flex:0 0 auto; color:var(--muted); font-size:54px; font-weight:900; }
  .thumbs { display:grid; grid-template-columns:1fr 1fr; gap:28px; }
  .thumb { height:220px; border-radius:30px; border:1px solid rgba(109,77,225,.10); background:radial-gradient(circle at 78% 78%,rgba(219,39,119,.23),transparent 34%),linear-gradient(135deg,#fff,#f5edff 56%,#ffe8ef); padding:42px; position:relative; overflow:hidden; }
  .thumb b { display:block; max-width:70%; font-size:38px; line-height:1.05; font-weight:900; }
  .thumb i { position:absolute; right:38px; top:62px; width:190px; height:88px; border-radius:999px; background:rgba(255,255,255,.86); box-shadow:0 22px 50px rgba(15,23,42,.10); }

  .repo-title-text, .product-title-text { display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden; text-overflow:ellipsis; }
  .repo-title-text { -webkit-line-clamp:2; max-height:calc(1.08em * 2); }
  .product-title-text { -webkit-line-clamp:1; max-height:1em; }
</style>
</head>

<div class="toolbar">
  <div>
    <h1>AI-Feeds 分享海报 v7 · flex 自适应高度</h1>
    <p>brand 移回顶部 hero / 来源 chip 在右上 / 底部分享人 + 二维码 / 海报高度由内容撑开</p>
  </div>
  <p>实际尺寸：<code>1080 × auto</code></p>
</div>
<main class="gallery" id="gallery"></main>

function qr(seed) {
  let out = `<svg class="qr-svg" viewBox="0 0 168 168" xmlns="http://www.w3.org/2000/svg"><rect width="168" height="168" fill="#fff"/>`;
  const finder = (x,y) => `<rect x="${x}" y="${y}" width="38" height="38" fill="#fff" stroke="#111" stroke-width="6"/><rect x="${x+13}" y="${y+13}" width="12" height="12" fill="#111"/>`;
  out += finder(18,18) + finder(112,18) + finder(18,112);
  for (let y=18; y<152; y+=6) {
    for (let x=18; x<152; x+=6) {
      const inF = (x<60&&y<60) || (x>106&&y<60) || (x<60&&y>106);
      if (inF) continue;
      const code = (x*13 + y*17 + seed.length*19 + seed.charCodeAt((x+y)%seed.length)) % 7;
      if (code < 3) out += `<rect x="${x}" y="${y}" width="5" height="5" fill="#111"/>`;
    }
  }
  return out + `</svg>`;
}

function hashSeed(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h)+s.charCodeAt(i); h|=0; } return Math.abs(h); }
function defaultNickname(seed){ const h=hashSeed(seed); return NICKNAME_POOL[h % NICKNAME_POOL.length] + ((h % 9000) + 1000); }
function defaultAvatar(seed){ const h=hashSeed(seed+':avatar'); const n=String((h % 30) + 1).padStart(2,'0'); return `https://ai-feeds.com/avatars/avatar-${n}.png`; }

function footerHtml(id) {
  // 每张海报用 id 作为 hash 种子 → 不同头像 + 昵称
  const avatar = defaultAvatar(id);
  const nickname = defaultNickname(id);
  return `<footer class="footer">
    <div class="sharer">
      <div class="sharer-avatar"><img src="${avatar}" alt=""></div>

        <small>分享自</small>

  </footer>`;
}

function engagement(items) { const ic=[icons.comment,icons.repost,icons.heart,icons.eye]; return `<div class="engagement">${items.map((t,i)=>`<div><span>${ic[i]}</span><span>${t}</span></div>`).join('')}</div>`; }
function metrics(d) { return `<div class="metric-row"><div><span>${ICON.star}</span><b>${d.stars}</b><small>Stars</small></div><div><span>${ICON.fork}</span><b>${d.forks}</b><small>Forks</small></div><div><span>${ICON.watching}</span><b>${d.watchers}</b><small>Watchers</small></div></div>`; }
function meta(d)    { return `<div class="meta-row"><span><span class="trophy-icon">${icons.trophy}</span> ${d.rank}</span><span class="contrib"><i></i><i></i><i></i><span>${d.contributors}</span></span></div>`; }
function phStats(d) { return `<div class="ph-stats">${d.stats.map(x=>{const [a,b]=x.split('|');return `<div><b>${a}</b><small>${b}</small></div>`}).join('')}</div>`; }

function chartPreview() {
  const charts=['ArenaHard','SWE-bench','SWE-ML','LiveCode','LiveBench','QwenWeb','NL2Repo','MCPMark','GAIA','HMMT','MMMU','WorldQA'];
  return `<div class="chart-preview"><div class="mini-charts">${charts.map((t,i)=>`<div class="mini-chart"><h4>${t}</h4><div class="bars"><b class="bar main" style="height:${38+(i*13)%40}px"></b><b class="bar" style="height:${32+(i*11)%34}px"></b><b class="bar google" style="height:${24+(i*7)%32}px"></b></div></div>`).join('')}</div><div class="legend"><span><i></i>Qwen3.6</span><span><i class="l2"></i>Qwen3.5</span><span><i class="l3"></i>Gemma/G</span></div></div>`;
}
function phThumbs() { return `<div class="thumbs"><div class="thumb"><b>Introducing Cloud Computer</b><i></i></div><div class="thumb"><b>Run Any Operation You've ever Wanted</b><i></i></div></div>`; }

function renderX(d) {
  return `<div class="poster ${d.id} x-card ${d.hasMedia?'x-media':'x-no'}">
    ${heroHtml(d.source)}
    <section class="content-card">
      <div class="top-line"><div class="author"><div class="avatar">${qwenLogo()}</div><div><div class="name-row"><div class="name">${d.author}</div>${d.verified?'<span class="verified">✓</span>':''}</div><div class="handle">${d.handle}</div></div></div></div>
      <h1 class="headline">${d.headline}</h1>
      <p class="body-text">${d.body}</p>
      ${d.hasMedia?chartPreview():''}
      ${engagement(d.engagement)}
    </section>
    ${footerHtml(d.id)}
  </div>`;
}
function renderGithub(d) {
  return `<div class="poster ${d.id} github-card">
    ${heroHtml(d.source)}
    <section class="content-card">
      <div class="repo-title"><div class="repo-logo">${repoLogo()}</div><div class="repo-name-wrap"><h1 class="headline repo-title-text">${d.repo}</h1><div class="category-line"><span class="pill small">${d.tag}</span></div></div></div>
      ${metrics(d)}
      ${meta(d)}
      <p class="body-text compact-body">${d.body}</p>
    </section>
    ${footerHtml(d.id)}
  </div>`;
}
function renderPh(d) {
  return `<div class="poster ${d.id} ph-card">
    ${heroHtml(d.source)}
    <section class="content-card">
      <div class="product-header"><div class="product-logo">${manusLogo()}</div><div class="product-info"><div class="product-title-row"><h1 class="headline product-title-text">${d.product}</h1><span class="rank">${d.rank}</span></div><div class="category-line"><span class="pill orange small">${d.tag}</span></div></div></div>
      <p class="body-text compact-body">${d.body}</p>
      ${phStats(d)}
      ${d.hasMedia?phThumbs():''}
    </section>
    ${footerHtml(d.id)}
  </div>`;
}
function renderPoster(d) { if(d.source==='x') return renderX(d); if(d.source==='github') return renderGithub(d); return renderPh(d); }

const gallery = document.getElementById('gallery');
DATA.forEach(d => {
  const wrap = document.createElement('section');
  wrap.className = 'poster-wrap';
  wrap.innerHTML = `<div class="caption"><b>${d.title}</b><span>${d.desc}</span></div><div class="poster-viewport">${renderPoster(d)}</div>`;
  gallery.appendChild(wrap);
});

// 高度自适应：scale 0.361 后 viewport 跟着 poster 实际 offsetHeight 走
function fitViewports() {
  const scale = 390/1080;
  document.querySelectorAll('.poster-viewport').forEach(vp => {
    const poster = vp.querySelector('.poster');
    if (poster) vp.style.height = (poster.offsetHeight * scale) + 'px';
  });
}
const ro = new ResizeObserver(fitViewports);
document.querySelectorAll('.poster').forEach(p => ro.observe(p));
window.addEventListener('load', fitViewports);
window.addEventListener('resize', fitViewports);
fitViewports();
</script>
</body>
</html>
